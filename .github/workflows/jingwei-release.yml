# 经纬织图：在 Releases 页面发布标签为 jingwei-vX.Y.Z 的版本后，从零构建并挂上免安装包。
# 当前发布命令只打 Windows 10／11 x64 与麒麟 V10 ARM64。其他目标仍可由 build_all.py 指定。
# 资产名是唯一 ASCII，中文只作显示名。不上传 .deb 与 NSIS 安装包。
# 手动运行默认只构建；填写 upload_tag 时上传到已有标签（不新建标签）。
name: jingwei-release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_tag:
        description: "上传到已有正式标签 jingwei-vX.Y.Z。留空则只构建，不上传。"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'jingwei-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JW_WORK: ${{ github.workspace }}/_work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装 Windows x64 启动器交叉编译工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: 构建本次发布的免安装包（Windows x64 与麒麟 ARM64）
        run: |
          npm ci
          bash build/fetch_runtime.sh linux-arm64 win32-x64
          python build/desktop/build_all.py --portable-only win64 kylin-arm64
      - name: 挂到 Releases（ASCII 资产名，不含安装包）
        if: github.event_name == 'release' || github.event.inputs.upload_tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.upload_tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^jingwei-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "只接受 jingwei-vX.Y.Z 标签，得到：${TAG}" >&2
            exit 1
          fi
          bash build/release_assets.sh
          line=$(grep '_windows_x64_portable.zip#' "$JW_WORK/assets/upload.list")
          name=$(basename "${line%%#*}")
          pkg=${name#jingwei_v}
          pkg=${pkg%%_*}
          if [ "${TAG#jingwei-v}" != "$pkg" ]; then
            echo "标签 $TAG 与包版本 $pkg 不一致" >&2
            exit 1
          fi
          mapfile -t SPECS < "$JW_WORK/assets/upload.list"
          [ "${#SPECS[@]}" -gt 0 ]
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${SPECS[@]}"
