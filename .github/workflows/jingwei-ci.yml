# 经纬织图：每次 PR 与合并到 main 时自动检查（构建＋语法降级校验＋核心回归）
name: jingwei-ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      JW_WORK: ${{ github.workspace }}/_work
    steps:
      - uses: actions/checkout@v4
      - name: 校验发版资产名（唯一 ASCII，不含安装包）
        run: |
          bash tests/release_assets_test.sh
          python3 tests/package_layout_test.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: |
          npm ci
          pip install playwright websocket-client
          # ubuntu-24.04 hosted runner 已含浏览器系统库，避免 apt 镜像故障阻塞测试。
          python -m playwright install chromium
          mkdir -p ~/.local/share/fonts
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf \
            -o ~/.local/share/fonts/NotoSansCJKsc-Regular.otf
          fc-cache -f
      - name: 构建网页版与桌面版界面（含 ES2019 降级校验）
        run: python3 build/build_web.py --desk
      - name: 准备测试环境（公开样例、可移植目录结构）
        run: |
          bash tests/fixtures/fetch_public.sh
          bash tests/legacy_layout.sh
      - name: 核心回归
        run: bash tests/run_regression.sh
      - name: 国别图标与新版功能集成回归
        run: |
          node tests/country_catalog_test.cjs
          python3 tests/country_icons_test.py
          python3 tests/mirror_arrow_ime_test.py
          python3 tests/ruler_arrow_test.py
          python3 tests/defaults_test.py
          node tests/canvasbg_logic.mjs
          python3 tests/canvasbg_ui.py
          python3 tests/scenario_tpl_test.py
          python3 tests/review_follow_test.py
          python3 tests/sector_fill_test.py
      - name: 图形编辑与导出回归
        run: |
          python3 tests/rotation_test.py
          python3 tests/coverage_test.py
          python3 tests/iconlabels_test.py
          python3 tests/layer_order_test.py
          python3 tests/selectionbounds_test.py
          python3 tests/recon_icons_test.py
          python3 tests/underwater_icon_test.py
