<style>
/* Layout: three-pane editor — palette | canvas | properties; collapses to strip / canvas / bottom sheet on phones */
:root{
  --bg:#EEF0F3; --panel:#FFFFFF; --line:#C9D2DE; --fg:#18202B; --muted:#4E5A6B;
  --accent:#1F5FBF; --accent-soft:#E5EDFA; --canvas:#F8F9FB; --dot:#D2D8E0; --hover:#F1F4F8;
  --danger:#C2412D;
  --ui:'Noto Sans SC','Microsoft YaHei','PingFang SC','Source Han Sans SC',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141A; --panel:#161D26; --line:#283341; --fg:#E4E9F0; --muted:#8C98A9;
  --accent:#5E9BFF; --accent-soft:#1B2A40; --canvas:#0C1117; --dot:#222C38; --hover:#1D2631; --danger:#FF7A63; --btn:#1F2935; --tile:#1B232E; --tile-line:#2B3644; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141A; --panel:#161D26; --line:#283341; --fg:#E4E9F0; --muted:#8C98A9;
  --accent:#5E9BFF; --accent-soft:#1B2A40; --canvas:#0C1117; --dot:#222C38; --hover:#1D2631; --danger:#FF7A63; --btn:#1F2935; --tile:#1B232E; --tile-line:#2B3644; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:13px;overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:6px;padding:6px max(12px,env(safe-area-inset-left,0px)) 6px max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;min-width:0}
.brand{font-weight:700;font-size:15px;letter-spacing:.04em;margin-right:8px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.brand .logo{width:24px;height:24px;flex:none}
.brand small{font-weight:400;color:var(--muted);font-size:11px;margin-left:6px;letter-spacing:0}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
button,.btn{font:inherit;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 9px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
button:hover{background:var(--hover);border-color:var(--line)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0}
textarea{resize:vertical}
.spacer{flex:1}
main{display:grid;grid-template-columns:232px minmax(0,1fr) 268px;min-height:0}
#palette,#props{background:var(--panel);overflow:auto;min-height:0}
#palette{border-right:1px solid var(--line);padding:10px 10px 24px}
#props{border-left:1px solid var(--line);padding:12px 14px 24px}
.psec{margin-bottom:12px}
.psec h4{margin:4px 2px 6px;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pitem{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;border:1px solid transparent;border-radius:6px;cursor:grab;user-select:none;text-align:center;font-size:11px;line-height:1.25;color:var(--fg);background:none}
.pitem:hover{background:var(--hover);border-color:var(--line)}
.pitem img{width:38px;height:38px;object-fit:contain;pointer-events:none}
.pitem svg{width:38px;height:30px;pointer-events:none}
/* 对比度增强：面板内普通按钮有明显边框与底色；图元格子有浅底，浅色图标也清晰 */
#props button:not(.primary):not(.on),.mdl button:not(.primary):not(.on){background:var(--btn,#F4F6F9);border-color:var(--line)}
#props button:not(.primary):not(.on):hover,.mdl button:not(.primary):not(.on):hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg button:not(.on){background:var(--btn,#F4F6F9)}
.seg button+button{border-left-color:var(--line)}
.pitem{background:var(--tile,#F3F5F9);border-color:var(--tile-line,#E1E6EE)}
.pitem:hover{background:var(--accent-soft);border-color:var(--accent)}
.pitem svg{color:var(--fg)}
.pgrid{gap:5px}
.search{width:100%;margin-bottom:8px}
#stage{position:relative;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);min-width:0;touch-action:none}
#svg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;touch-action:none;user-select:none}
#crumb{position:absolute;left:12px;top:10px;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:12px;z-index:2;max-width:calc(100% - 24px);overflow-x:auto}
#crumb button{padding:2px 6px}
#crumb .cur{font-weight:700;padding:2px 6px;white-space:nowrap}
#zoombox{position:absolute;right:12px;bottom:12px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;z-index:2;font-variant-numeric:tabular-nums}
#zoombox span{padding:5px 6px;min-width:44px;text-align:center;color:var(--muted)}
#editor{position:absolute;z-index:5;display:none;font-family:var(--ui);text-align:center;border:2px solid var(--accent);border-radius:4px;padding:4px;background:var(--panel);color:var(--fg);resize:none}
.row{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row>label{width:58px;color:var(--muted);font-size:12px;flex:none}
.row>*:not(label){flex:1;min-width:0}
.props h3{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.props h3 .tag{font-size:11px;font-weight:400;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border-radius:0;border:none;padding:5px 4px;justify-content:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid3 button,.grid2 button{justify-content:center;border-color:var(--line)}
.hint{color:var(--muted);font-size:12px;line-height:1.7}
.hint kbd{font-family:inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11px;background:var(--bg)}
.iconprev{width:44px;height:44px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;flex:none!important}
.iconprev img{width:36px;height:36px;object-fit:contain}
hr{border:none;border-top:1px solid var(--line);margin:12px 0}
.swatch{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle}
.mdl{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,15,22,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.mdl .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(760px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.mdl .mh{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mdl .mb{overflow:auto;padding:10px 12px}
#help-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 24px;padding:12px 16px 16px}
#help h5{margin:10px 0 6px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.08em}
#help .kr{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
#help .kk{flex:none;min-width:136px;display:flex;flex-wrap:wrap;align-items:center;gap:2px}
#help kbd{font-family:inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11.5px;background:var(--bg);white-space:nowrap}
#help .ks{color:var(--muted);font-size:11px;padding:0 1px}
#b-help{width:30px;justify-content:center;border-color:var(--line);border-radius:50%;padding:4px 0;font-weight:700;margin-right:4px}
.psec h4 .cnt{display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.psec h4 .cnt i{font-style:normal;width:10px;text-align:center}
.psec h4:hover{color:var(--fg)}
.psec{border-bottom:1px solid transparent}
.psec:not(.open){margin-bottom:2px}
#world .lk{transition:opacity .12s}
#world.hl .lk{opacity:.16}
#world.hl .lk.on{opacity:1}
#world.hl .lk.on .lv{stroke-width:2.8px}
#modal .tabs{display:flex;gap:4px;flex-wrap:wrap}
#modal .igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
#modal .igrid button{flex-direction:column;border-color:var(--line);font-size:11px;padding:6px 4px}
#modal .igrid img{width:52px;height:52px;object-fit:contain}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:calc(100% - 32px)}
#toast.show{opacity:1}
.menu{position:relative}
.menu .dd{position:absolute;top:calc(100% + 4px);right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;display:none;flex-direction:column;min-width:210px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.menu.open .dd{display:flex}
.menu .dd button{justify-content:flex-start}
.menu .dd small{color:var(--muted);margin-left:auto;font-size:11px}
@media (max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}
  #palette{border-right:none;border-bottom:1px solid var(--line);max-height:132px;padding:8px max(16px,env(safe-area-inset-left,0px))}
  #palette .pgrid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
  #props{border-left:none;border-top:1px solid var(--line);max-height:34vh;padding:10px max(16px,env(safe-area-inset-left,0px))}
  .brand small{display:none}
  .hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){#toast,#world .lk{transition:none}}
