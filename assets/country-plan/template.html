<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>经纬织图 · 中美外形对照清单</title><style>body{font:14px system-ui;margin:24px;color:#203047;background:#f5f7fa}header{position:sticky;top:0;background:#f5f7fa;padding:12px 0}h1{font-size:24px;margin:8px 0}p{line-height:1.6}input,select{padding:8px;margin-right:8px;max-width:100%;font:inherit}table{border-collapse:collapse;width:100%;background:white}td,th{white-space:pre-line;padding:10px;border:1px solid #d8e0ea;text-align:left;vertical-align:top}th{background:#e7edf5}small{color:#60738b}.notice{border-left:4px solid #c18b21;padding:8px 12px;background:#fff8df}#stats{margin:10px 0}.key{font:11px monospace;white-space:nowrap}</style><header><h1>经纬织图 · 中美外形对照清单</h1><p class="notice">清单初版：候选型号及构型尚未完成公开来源和外形核对，不能直接作为已核验的重绘依据。已完成的通用图标照常使用。</p><p>外形选择：通用／中国／美国；阵营涂装：原色／红方／蓝方。两者独立，不把国家固定绑定红蓝方。</p><input id="q" placeholder="搜索图标、型号或说明"><select id="cat"><option value="">全部类别</option></select><select id="strategy"><option value="">全部处理方式</option></select><span id="count"></span><div id="stats"></div></header><table><thead><tr><th>现有图标</th><th>处理方式</th><th>中国候选／方向</th><th>美国候选／方向</th><th>状态与说明</th></tr></thead><tbody id="rows"></tbody></table><script>const plan=__DATA__;const rows=document.querySelector('#rows'),q=document.querySelector('#q'),cat=document.querySelector('#cat'),strategy=document.querySelector('#strategy');for(const [el,values] of [[cat,[...new Set(plan.icons.map(x=>x.category))]],[strategy,Object.keys(plan.summary)]])for(const value of values){const o=document.createElement('option');o.value=o.textContent=value;el.append(o)}document.querySelector('#stats').textContent=Object.entries(plan.summary).map(([k,v])=>k+' '+v+' 项').join(' ｜ ');function draw(){rows.textContent='';let n=0;const norm=s=>String(s).toLowerCase().replace(/[\s\-·（）()_]/g,'');const search=norm(q.value.trim());for(const r of plan.icons){if(cat.value&&r.category!==cat.value||strategy.value&&r.strategy!==strategy.value)continue;if(search&&!norm([r.name,r.key,r.category,r.strategy+'\n'+r.production_phase,r.china_candidate,r.usa_candidate,r.note].join(' ')).includes(search))continue;n++;const tr=document.createElement('tr');for(const value of [r.name+' · '+r.category+'\n'+r.key,r.strategy+'\n'+r.production_phase,r.china_candidate,r.usa_candidate,r.reference_status+'。'+r.note]){const td=document.createElement('td');td.textContent=value;tr.append(td)}rows.append(tr)}document.querySelector('#count').textContent='显示 '+n+' / '+plan.total+' 项'}q.oninput=cat.onchange=strategy.onchange=draw;draw();</script>
