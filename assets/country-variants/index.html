<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>经纬织图 · 中美外形图册</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#16253a;font:15px system-ui,sans-serif}header{padding:28px 5vw;background:#10243c;color:white}h1{margin:0 0 12px;font-size:26px}header p{max-width:950px;line-height:1.7;color:#c3d3e4}nav{position:sticky;top:0;background:#fff;padding:14px 5vw;display:flex;gap:12px;box-shadow:0 2px 10px #1232;z-index:1}input,select{font:inherit;padding:9px;border:1px solid #bbc8d6;border-radius:6px}input{flex:1}main{padding:24px 5vw;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}article{background:white;border-radius:12px;padding:16px;box-shadow:0 3px 12px #1231}h2{font-size:17px;margin:0 0 8px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.model{min-width:0;text-align:center}.model img{width:100%;aspect-ratio:1;object-fit:contain;background:repeating-conic-gradient(#f5f7fa 0% 25%,#fff 0% 50%) 0/20px 20px}.model strong{display:block;margin:7px 0;font-size:14px}.cn{color:#b92535}.us{color:#175caf}small,summary{font-size:12px;color:#52647b}details{margin-top:14px;font-size:12px;line-height:1.7}a{color:#235e9b;overflow-wrap:anywhere}.pending{padding:30px 5px;color:#6c7684}body.dark{background:#142033;color:#eaf0fa}.dark article,.dark nav{background:#24344a}.dark .model img{background:#1a283c}.dark small,.dark summary{color:#bacbdf}@media print{nav{display:none}header{background:white;color:black}header p{color:#555}main{display:block}article{break-inside:avoid;margin-bottom:20px;box-shadow:none;border:1px solid #ccc}.model img{height:180px}details{display:none}}</style><header><h1>经纬织图 · 中美外形图册</h1><p id="progress">加载图册…</p><p>中国默认红色，美国默认蓝色；颜色直接落在装备面板与人员装备上。公开外形艺术参考不代表性能对等、实装载荷或精确测绘。任务构型与待核实项目逐项注明。</p></header><nav><input id="q" placeholder="搜索角色、型号或类别"><select id="cat"><option value="">全部类别</option></select><select id="paint"><option value="default">中国红 / 美国蓝</option><option value="neutral">原色</option><option value="red">全部红方</option><option value="blue">全部蓝方</option></select><button id="dark">深浅底</button></nav><main id="grid"></main><script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let catalog;
function show(){const q=document.querySelector('#q').value.toLowerCase(),cat=document.querySelector('#cat').value,paint=document.querySelector('#paint').value;const roles=new Map();catalog.roles.forEach(r=>roles.set(r.key,[]));catalog.items.forEach(x=>{if(!roles.has(x.key))roles.set(x.key,[]);roles.get(x.key).push(x)});for(const r of catalog.roles)if(!roles.get(r.key).length)roles.set(r.key,[{key:r.key,roleName:r.name,category:r.category,country:'pending',model:'',sources:[],notes:'两国外形缺少可靠公开参考，保留通用图标。'}]);document.querySelector('#grid').innerHTML=[...roles.values()].filter(xs=>(!cat||xs[0].category===cat)&&(!q||xs.some(x=>(x.roleName+' '+x.model+' '+x.category+' '+x.key).toLowerCase().includes(q)))).map(xs=>{const a=xs[0];return '<article><h2>'+esc(a.roleName)+'</h2><small>'+esc(a.category)+' · '+esc(a.key)+'</small><div class="pair">'+['cn','us'].map(c=>{const x=xs.find(x=>x.country===c);if(!x){const role=catalog.roles.find(r=>r.key===a.key);return '<div class="pending">'+(role&&role.countries&&!role.countries.includes(c)?'本项为中国专用型号，不强配美国外形':(c==='cn'?'中国':'美国')+'外形待补')+'</div>';}const side=paint==='default'?(c==='cn'?'red':'blue'):paint;return '<div class="model"><img loading="lazy" src="'+esc(x.files[side])+'" alt="'+esc(x.model)+'"><strong class="'+c+'">'+(c==='cn'?'中国':'美国')+' · '+esc(x.model)+'</strong><small>'+(x.qualityStatus==='awaiting-manual-review'?'数量细节待修订':x.modelStatus==='illustrative-configuration'?'任务／组件示意构型':'公开外形艺术参考')+'</small></div>'}).join('')+'</div><details><summary>参考来源与限制</summary>'+xs.map(x=>'<p>'+esc(x.model)+'：'+esc(x.notes)+' '+esc((x.qualityNotes||[]).join(' '))+'</p>'+x.sources.map(s=>'<a target="_blank" rel="noopener noreferrer" href="'+esc(s.url)+'">'+esc(s.title||s.url)+'</a><br>').join('')).join('')+'</details></article>'}).join('')}
fetch('catalog.json').then(r=>r.json()).then(d=>{catalog=d;document.querySelector('#progress').textContent='目标 '+d.targetRoles+' 项角色 · 已生成 '+d.readyModels+' 个国别外形 · '+d.readyPairs+' 项双版本齐备 · 待补 '+d.pending.length+' 个外形。';[...new Set(d.items.map(x=>x.category))].sort().forEach(c=>document.querySelector('#cat').insertAdjacentHTML('beforeend','<option>'+esc(c)+'</option>'));show()}).catch(()=>document.querySelector('#progress').textContent='请通过本地 HTTP 服务打开图册，或使用构建生成的单文件图册。');document.querySelector('#q').oninput=show;document.querySelector('#cat').onchange=show;document.querySelector('#paint').onchange=show;document.querySelector('#dark').onclick=()=>document.body.classList.toggle('dark');
</script></html>
