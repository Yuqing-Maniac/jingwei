<!doctype html><meta charset="utf-8"><title>经纬织图 · 全库重绘检视</title>
<style>body{font:14px system-ui;margin:24px;background:#f2f4f7;color:#182739}header{position:sticky;top:0;background:inherit;padding:12px;z-index:2}#grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.card{background:#fff;border:1px solid #ccd4df;border-radius:8px;padding:8px;text-align:center}.card img{width:100%;height:128px;object-fit:contain}.key{font:10px monospace;color:#678}.pending{opacity:.4}body.dark{background:#101b29;color:#eee}.dark .card{background:#1d2d40}.dark .key{color:#abc}select,button{padding:8px}h1{font-size:22px}</style>
<header><h1>经纬织图 · 全库重绘检视</h1><select id="side"><option value="neutral">原色</option><option value="blue">蓝方涂装</option><option value="red">红方涂装</option></select> <button onclick="document.body.classList.toggle('dark')">浅色／深色背景</button> <span id="count"></span></header><main id="grid"></main>
<script>
fetch('catalog.json').then(r=>r.json()).then(c=>{const grid=document.querySelector('#grid'),side=document.querySelector('#side');function draw(){grid.textContent='';let ready=0;for(const i of c.icons){const done=i.status!=='pending';if(done)ready++;const card=document.createElement('div');card.className='card'+(done?'':' pending');const img=new Image();img.src='icons/'+i.key+'-'+side.value+'.webp';img.onerror=()=>img.style.visibility='hidden';const title=document.createElement('div');title.textContent=i.name;const key=document.createElement('div');key.className='key';key.textContent=i.key+' · '+(done?'首轮已检查':'待生成');card.append(img,title,key);grid.append(card)}document.querySelector('#count').textContent=ready+' / '+c.icons.length+' 已打包';}side.onchange=draw;draw();});
</script>
