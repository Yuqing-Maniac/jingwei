<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>经纬织图 · 全库图册</title>
<style>body{font:14px system-ui;margin:24px;background:#f2f4f7;color:#182739}header{position:sticky;top:0;background:inherit;padding:12px;z-index:2}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}.card{background:#fff;border:1px solid #ccd4df;border-radius:8px;padding:8px;text-align:center}.card img{width:100%;height:128px;object-fit:contain}.key{font:10px monospace;color:#678;overflow-wrap:anywhere}.cat{font-size:11px;color:#678;margin-top:4px}.pending{opacity:.4}body.dark{background:#101b29;color:#eee}.dark .card{background:#1d2d40}.dark .key,.dark .cat{color:#abc}select,button,input{padding:8px;margin:3px;max-width:100%;font:inherit}h1{font-size:22px}.tools{display:flex;align-items:center;flex-wrap:wrap}#count{font-size:13px}body.large #grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}body.large .card img{height:220px}</style>
<header><h1>经纬织图 · 全库图册</h1><div class="tools"><input id="query" placeholder="搜索名称、类别或编号" aria-label="搜索图标"><select id="category" aria-label="图标类别"><option value="">全部类别</option></select><select id="side" aria-label="阵营涂装"><option value="neutral">原色</option><option value="blue">蓝方涂装</option><option value="red">红方涂装</option></select><button onclick="document.body.classList.toggle('dark')">浅色／深色</button><button onclick="document.body.classList.toggle('large')">放大／缩小</button><span id="count"></span></div></header><main id="grid"></main>
<script>
fetch('catalog.json').then(r=>r.json()).then(c=>{
const grid=document.querySelector('#grid'),side=document.querySelector('#side'),query=document.querySelector('#query'),category=document.querySelector('#category');
for(const name of [...new Set(c.icons.map(i=>i.cat))]){const opt=document.createElement('option');opt.value=name;opt.textContent=name+'（'+c.icons.filter(i=>i.cat===name).length+'）';category.append(opt);}
function draw(){grid.textContent='';let shown=0;const q=query.value.trim().toLocaleLowerCase();
for(const i of c.icons){if(category.value&&category.value!==i.cat)continue;if(q&&!(i.name+' '+i.cat+' '+i.key+' '+(i.keywords||[]).join(' ')+' '+(i.addedIn==='3.5.0'?'本轮新增':'')).toLocaleLowerCase().includes(q))continue;shown++;const done=i.status!=='pending';const card=document.createElement('div');card.className='card'+(done?'':' pending');const img=new Image();img.src='icons/'+i.key+'-'+side.value+'.webp';img.alt=i.name;img.onerror=()=>img.style.visibility='hidden';const title=document.createElement('div');title.textContent=i.name;const cat=document.createElement('div');cat.className='cat';cat.textContent=i.cat;const key=document.createElement('div');key.className='key';key.textContent=i.key+' · '+(i.status==='reviewed-first-pass'?'首轮已检查':done?'已生成，待检视':'待生成');card.append(img,title,cat,key);grid.append(card);}
document.querySelector('#count').textContent='显示 '+shown+' / '+c.icons.length+' 个';}
side.onchange=draw;category.onchange=draw;query.oninput=draw;draw();});
</script>
